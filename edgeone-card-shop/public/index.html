<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卡密商店</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;520;650;760;820&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>
          <span id="siteName">卡密商店</span>
        </div>
        <div class="nav-actions">
          <a class="btn ghost" href="/admin/"><i class="bi bi-shield-lock"></i>后台</a>
        </div>
      </header>

      <section class="hero">
        <div>
          <h1 id="heroTitle">卡密商店</h1>
          <p id="heroSubtitle">自动发卡、订单查询、轻量管理，适合部署在 Tencent EdgeOne Pages。</p>
          <div class="stat-row">
            <div class="stat">
              <strong id="productCount">0</strong>
              <span>在售商品</span>
            </div>
            <div class="stat">
              <strong id="stockCount">0</strong>
              <span>可用库存</span>
            </div>
          </div>
        </div>
        <aside class="notice" id="notice">请先登录后台配置分类、商品、支付与卡密。</aside>
      </section>

      <main class="main">
        <div class="toolbar">
          <div class="tabs" id="categoryTabs"></div>
          <form class="nav-actions" id="lookupForm">
            <input id="lookupNo" placeholder="输入订单号查询" required>
            <button class="btn" type="submit"><i class="bi bi-search"></i>查询</button>
          </form>
        </div>
        <div class="order-result" id="lookupResult" hidden></div>
        <section class="grid" id="productGrid"></section>
      </main>
    </div>

    <dialog class="dialog" id="buyDialog">
      <form id="buyForm">
        <div class="dialog-head">
          <strong id="buyTitle">购买商品</strong>
          <button class="icon-btn" type="button" id="closeBuy" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="dialog-body">
          <div class="field">
            <label>价格</label>
            <input id="buyPrice" disabled>
          </div>
          <div class="field">
            <label>接收邮箱或联系方式</label>
            <input id="buyEmail" autocomplete="email" placeholder="用于订单核对，可选">
          </div>
          <div class="order-result" id="orderResult" hidden></div>
        </div>
        <div class="dialog-foot">
          <span class="muted">提交订单后按提示付款</span>
          <button class="btn primary" type="submit"><i class="bi bi-check2-circle"></i>创建订单</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
