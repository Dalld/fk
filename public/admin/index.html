<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>发卡后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;520;650;760;820&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="login-page" id="loginPage">
      <form class="panel login-box" id="loginForm">
        <div class="panel-head"><strong>后台登录</strong></div>
        <div class="panel-body">
          <p class="muted">首次登录会自动创建管理员账号。</p>
          <div class="field">
            <label>用户名</label>
            <input id="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label>密码</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="muted" id="loginError"></p>
          <button class="btn primary" type="submit"><i class="bi bi-box-arrow-in-right"></i>登录</button>
        </div>
      </form>
    </main>

    <div class="admin-layout" id="adminApp" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"><i class="bi bi-shield-lock-fill"></i></span>
          <span>发卡后台</span>
        </div>
        <nav class="side-nav">
          <button class="btn active" data-view="dashboard"><i class="bi bi-speedometer2"></i>概览</button>
          <button class="btn" data-view="settings"><i class="bi bi-sliders"></i>设置</button>
          <button class="btn" data-view="categories"><i class="bi bi-tags"></i>分类</button>
          <button class="btn" data-view="products"><i class="bi bi-box-seam"></i>商品</button>
          <button class="btn" data-view="cards"><i class="bi bi-key"></i>卡密</button>
          <button class="btn" data-view="orders"><i class="bi bi-receipt"></i>订单</button>
        </nav>
      </aside>

      <main class="admin-main">
        <header class="admin-head">
          <div>
            <h1 id="pageTitle">概览</h1>
            <div class="muted">当前管理员：<span id="adminName"></span></div>
          </div>
          <div class="nav-actions">
            <span id="message" class="badge">就绪</span>
            <a class="btn" href="/"><i class="bi bi-house"></i>前台</a>
            <button class="btn danger" id="logout"><i class="bi bi-box-arrow-right"></i>退出</button>
          </div>
        </header>
        <section id="content"></section>
      </main>
    </div>

    <script src="/admin/admin.js" type="module"></script>
  </body>
</html>
